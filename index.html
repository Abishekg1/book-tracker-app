<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookTracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>BookTracker</h1>
        <p class="tagline">Log the books you want, the ones you are reading, and the ones you finished.</p>
    </header>
    <main>
        <section class="auth-email"><h2>Account</h2>
        <label for="auth-email">Email</label>
        <input   type="email" id="auth-email" placeholder="Email">
        <label for="auth-password">Password</label>
        <input  type="password" id="auth-password" placeholder="Password">
        <div>
            <button type="button" id="signup-btn">Sign Up</button>
            <button type="button" id="login-btn">Log In</button>
            <button type="button" id="logout-btn">Log Out</button>
        </div>
        <p id="auth-message"></p>

        
        
        
        </section>
                         
        <section class="add-section">
            <h2>Add a book</h2>
            <form id="add-form">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
                
                <label for="author">Author</label>
                <input type="text" id="author" name="author" required>
                
                <label for="reason">Reason</label>
                <input type="text" id="reason" name="reason"  placeholder="One line is enough">
                
                <button type="submit" class="primary">Add Book</button>
            </form>
            
        </section>
        <section>
            <div class="list-header">
                <h2>My books</h2>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="want">Want to read</button>
                <button class="filter-btn" data-filter="reading">Reading</button>
                <button class="filter-btn" data-filter="finished">Finished</button>
            </div>

            </div>
            <div id="counts"></div>
            
            <div id="book-list"></div>
        </section>

    </main>

  <footer>
      <p>Your list is saved in this browser. Refresh anytime,it will still be here.</p>
  </footer>
  <script type="module" src="app.js"></script> 
</body>
</html>
